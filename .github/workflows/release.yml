name: Release

# Publishes @cubitrek/agent-passport-verifier when a tag like verifier-v0.1.2 is pushed.
# Needs the NPM_TOKEN repository secret (an npm automation token with publish rights on @cubitrek).

on:
  push:
    tags: ["verifier-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tag matches package version
        run: test "verifier-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
